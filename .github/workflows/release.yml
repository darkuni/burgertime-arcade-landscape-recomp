name: release
# Publish a GitHub release (Releases > Draft a new release > Publish) and this
# workflow builds Windows + macOS and attaches them to it.
# Run manually (Actions > release > Run workflow) to just get the builds as artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOFLAGS: -mod=mod

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - name: Build burgertime.exe
        env: {GOOS: windows, GOARCH: amd64, CGO_ENABLED: '0'}
        run: go build -trimpath -ldflags "-H=windowsgui -s -w" -o burgertime.exe ./cmd/burgertime
      - uses: actions/upload-artifact@v4
        with: {name: burgertime-windows, path: burgertime.exe}

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - name: Build Burger Time.app (universal)
        run: |
          set -e
          APP="dist/Burger Time.app"
          mkdir -p "$APP/Contents/MacOS"
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "-s -w" -o dist/bt-arm64 ./cmd/burgertime
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "-s -w" -o dist/bt-amd64 ./cmd/burgertime
          lipo -create -output "$APP/Contents/MacOS/burgertime" dist/bt-arm64 dist/bt-amd64
          cat > "$APP/Contents/Info.plist" <<'PL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>burgertime</string>
          <key>CFBundleIdentifier</key><string>local.burgertime</string>
          <key>CFBundleName</key><string>Burger Time</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PL
          codesign --force --deep -s - "$APP"
          cd dist && zip -qry ../BurgerTime-mac.zip "Burger Time.app"
      - uses: actions/upload-artifact@v4
        with: {name: burgertime-mac, path: BurgerTime-mac.zip}

  publish:
    if: github.event_name == 'release'
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/burgertime.exe out/BurgerTime-mac.zip --clobber --repo "${{ github.repository }}"
